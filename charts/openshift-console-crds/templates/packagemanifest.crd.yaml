{{- if .Values.crds.PackageManifest }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{ with .Values.annotations }}
    {{ toYaml . | nindent 4 | join "\n" }}
    {{ end }}
  name: packagemanifests.packages.operators.coreos.com
spec:
  group: packages.operators.coreos.com
  names:
    categories:
      - olm
    kind: PackageManifest
    listKind: PackageManifestList
    plural: packagemanifests
    singular: packagemanifest
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: The catalog this package belongs to
          jsonPath: .status.catalogSource
          name: Catalog
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          # PackageManifest is normally served by OLM's packageserver as an
          # aggregated API, not as a CRD, and therefore has no upstream CRD
          # manifest to vendor here. This definition mirrors that API's shape
          # for clusters running without packageserver, where the console's
          # OperatorHub views expect the resource to exist; nested per-CSV
          # metadata is left open rather than restated field by field.
          description: PackageManifest holds information about a package repository in a catalog.
          type: object
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation of an object. Servers should convert recognized schemas to the latest internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this object represents. Servers may infer this from the endpoint the client submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: spec is empty; a PackageManifest's content is entirely reported in status.
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              description: status represents the current information/status for the package.
              type: object
              properties:
                catalogSource:
                  description: catalogSource is the name of the CatalogSource this package belongs to.
                  type: string
                catalogSourceDisplayName:
                  description: catalogSourceDisplayName is the display name of the CatalogSource this package belongs to.
                  type: string
                catalogSourceNamespace:
                  description: catalogSourceNamespace is the namespace of the CatalogSource this package belongs to.
                  type: string
                catalogSourcePublisher:
                  description: catalogSourcePublisher is the publisher of the CatalogSource this package belongs to.
                  type: string
                packageName:
                  description: packageName is the name of the overall package, ala etcd.
                  type: string
                defaultChannel:
                  description: defaultChannel is, if specified, the name of the default channel for the package.
                  type: string
                provider:
                  description: provider is the provider of the package's default channel CSV.
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                deprecation:
                  description: deprecation is an optional field which contains information if the package is deprecated.
                  type: object
                  properties:
                    message:
                      type: string
                channels:
                  description: channels are the declared channels for the package, ala stable or alpha.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: name is the name of the channel, e.g. stable.
                        type: string
                      currentCSV:
                        description: currentCSV defines the name of the CSV holding the channel's current version.
                        type: string
                      currentCSVDesc:
                        description: currentCSVDesc is a subset of the current CSV's spec, copied here so that clients need not fetch the CSV itself.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      entries:
                        description: entries are the channel's bundle entries, newest first.
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      deprecation:
                        description: deprecation is an optional field which contains information if the channel is deprecated.
                        type: object
                        properties:
                          message:
                            type: string
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
