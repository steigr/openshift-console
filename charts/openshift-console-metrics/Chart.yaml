apiVersion: v2
description: >-
  Monitoring wiring the OpenShift Console "Overview" dashboard needs, for
  clusters that don't run cluster-monitoring-operator itself: recording rules
  (network transfer, pod count) and scrape config (KubeVirt component
  metrics). Renders as PrometheusRule/ServiceMonitor or VictoriaMetrics
  VMRule/VMServiceScrape depending on which CRDs are present in the cluster
  (auto-detected by default, see values.yaml).
icon: https://github.com/openshift/console/raw/master/frontend/public/imgs/logos/openshift.svg
keywords:
  - openshift-console
  - prometheus
  - victoriametrics
  - recording-rules
  - kubevirt
kubeVersion: '>=1.16.0-0'
name: openshift-console-metrics
type: application
version: 0.3.0
