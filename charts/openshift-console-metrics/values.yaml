## Namespace-less by default: rule/scrape resources are created in the release namespace.
## Override if your PrometheusRule/VMRule/ServiceMonitor/VMServiceScrape operator only
## selects resources from a specific namespace.
namespaceOverride: ""

## Extra labels merged onto every rendered resource so your operator's
## ruleSelector/serviceMonitorSelector picks it up (e.g. VictoriaMetrics
## vmoperator's `*Selector`/`*NamespaceSelector` fields, or prometheus-operator's
## equivalents on the Prometheus/VMAgent CR).
labels: {}
  # prometheus: victoria-metrics
  # role: monitoring

## Which CRD flavor to render. When autoDetect is true (the default), prometheus/
## victoriaMetrics below are ignored: the chart renders VMRule/VMServiceScrape if
## the VMRule CRD (operator.victoriametrics.com/v1beta1) is present, else
## PrometheusRule/ServiceMonitor if that CRD (monitoring.coreos.com/v1) is
## present, else the release fails. VictoriaMetrics is preferred over Prometheus
## when both CRDs are present.
##
## Set autoDetect to false to control rendering explicitly instead - either or
## both of prometheus/victoriaMetrics may be enabled to render both resources.
autoDetect: true
prometheus: false
victoriaMetrics: false

## Individual rule groups can be disabled if you only need one.
rules:
  nodeExporter: true
  clusterMonitoringOperator: true

## Extra labels to strip from kube_running_pod_ready's output, on top of the
## upstream cluster-monitoring-operator exclusion list (condition, container,
## endpoint, instance, job, service). Needed when your Prometheus/VictoriaMetrics
## instance injects a global external label (e.g. federation's "prometheus"
## label) onto scraped/ingested series: node_namespace_pod:kube_pod_info: (the
## metric the console dashboard joins kube_running_pod_ready against) is
## normally built with an inclusion-style `by(...)` aggregation that already
## drops such labels, so kube_running_pod_ready must drop them too or the
## dashboard's `ignoring(node,uid)` join silently matches nothing.
dropExternalLabels:
  - prometheus

## Scrape configs the console dashboard's widgets depend on but that upstream
## component operators don't ship a ServiceMonitor/VMServiceScrape for.
scrapes:
  ## KubeVirt exposes all of virt-api/virt-controller/virt-handler/virt-operator
  ## through a single Service (kubevirt-prometheus-metrics) selected by the
  ## `prometheus.kubevirt.io: "true"` pod label - see
  ## https://kubevirt.io/user-guide/operations/component_monitoring/. Without
  ## this scrape target, KubeVirt component metrics are never ingested at all,
  ## which is why the console's "OpenShift Virtualization" status card shows
  ## Degraded even when KubeVirt itself is healthy (its query returns no data,
  ## and the card treats no data as Degraded rather than Not available).
  kubevirt:
    enabled: true
    namespace: kubevirt-hyperconverged
    matchLabels:
      prometheus.kubevirt.io: "true"
    portName: metrics
    scheme: https
    insecureSkipVerify: true
