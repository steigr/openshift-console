apiVersion: v2
name: openshift-console
description: >-
  Helm chart for the OpenShift web console (`bridge`) image built by this
  repo's containers/openshift-console/Dockerfile from patched
  openshift/console sources. Deploys the console Deployment/Service and
  wires up the dynamic plugins listed in Values.plugins. Supports either
  OpenShift's built-in OAuth server (OAuthClient + Route, the default) or
  an external OIDC IdP fronted by a Gateway API HTTPRoute, selected via
  Values.auth.mode / Values.ingress.httpRoute.
type: application
version: 0.4.0
appVersion: "release-4.22"
