# Default values for console.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: steigr/openshift-console
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Pin by digest instead (full "sha256:..." string). When set, this takes
  # precedence over tag/appVersion and the image is referenced as
  # "repository@sha256:...".
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Override for the container's entrypoint. Only needed for images with no
# ENTRYPOINT of their own (only a CMD, e.g. this repo's own
# containers/openshift-console build) -- setting `args` without `command`
# there would replace the image's CMD wholesale rather than appending to it,
# dropping the binary path itself. Leave empty for images that already carry
# a working ENTRYPOINT (e.g. quay.io/openshift/origin-console).
command: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# console serves HTTPS itself (no separate TLS-terminating proxy in front of
# the pod) using a serving-cert Secret that OpenShift's service-ca-operator
# auto-populates from the Service annotation below.
service:
  type: ClusterIP
  port: 8443
  # Name of the Secret the service-ca-operator will create/maintain,
  # containing tls.crt/tls.key for this Service's ClusterIP DNS name.
  # Leave empty to default to "<fullname>-serving-cert".
  servingCertSecretName: ""

# The <fullname>-service-ca ConfigMap, injected by the service-ca-operator
# with the cluster's service-serving CA bundle and passed to bridge via
# --service-ca-file so it can verify TLS on other in-cluster OpenShift
# services (e.g. plugin backends fronted by service-ca-signed certs).
# Requires the service-ca-operator to be present on the cluster; disabled
# by default since that's not guaranteed for every install target.
serviceCa:
  enabled: false

route:
  create: true
  # Empty lets the cluster's default *.apps ingress domain assign one, but
  # then config.baseAddress (used for --base-address and the OAuthClient's
  # redirect URI) can't be derived automatically -- set one of the two
  # explicitly, or the console will come up without a usable OAuth redirect
  # until you upgrade the release with the actual assigned host filled in.
  host: ""
  termination: reencrypt
  insecureEdgeTerminationPolicy: Redirect

# console needs an OAuthClient (oauth.openshift.io/v1, cluster-scoped) so
# users can log in via the cluster's built-in OAuth server. Only used (and
# only rendered) when auth.mode is "openshift" (the default). Set create:
# false and point existingSecretName at your own Secret (key: clientSecret)
# if this is managed outside the chart.
oauthClient:
  create: true
  name: console-oauth-client
  existingSecretName: ""
  # grantMethod is one of: auto, prompt, deny.
  grantMethod: auto

# How users authenticate to the console.
#   openshift (default): OpenShift's built-in OAuth server, via the
#     OAuthClient managed above. Existing behavior, unchanged.
#   oidc: an external OIDC IdP, bypassing OpenShift's OAuth server
#     entirely (oauthClient.* / templates/oauthclient.yaml are skipped).
auth:
  mode: openshift
  oidc:
    # Issuer URL of the external IdP, e.g.
    # https://auth.example.com/default/application/o/openshift-console/
    issuerUrl: ""
    clientId: ""
    # Secret holding the OIDC client secret, mounted into the pod and passed
    # via BRIDGE_USER_AUTH_OIDC_CLIENT_SECRET_FILE. Kept as a file mount
    # rather than the client secret's own value going through an env var
    # directly, so the secret itself never sits in the container's process
    # environment.
    existingSecretName: ""
    secretKey: client_secret
    tokenScopes:
      - email
      - profile
      - groups
      # Required for the IdP to issue a refresh token; without it, bridge's
      # refreshSession() has nothing to rotate once the access token expires
      # and every request starts failing with 401.
      - offline_access
    # Sets BRIDGE_USER_AUTH_KUBEADMIN_GROUP_NAME -- the IdP group (matched by
    # suffix) whose members bridge treats as cluster-admin-equivalent for its
    # own UI affordances.
    kubeadminGroupName: ""
    # Sets BRIDGE_USER_AUTH_OIDC_GROUP_MATCHER / _EXCLUDE_GROUP_MATCHER --
    # regexes that allow-list/deny-list which of the user's groups get
    # forwarded as Impersonate-Group headers. Empty (default) forwards every
    # group.
    groupMatcher: ""
    excludeGroupMatcher: ""
    # Sets BRIDGE_USER_AUTH_PREFERRED_USER_IDENTIFIER. "username" (bridge's
    # own default) uses the user's email for the Impersonate-User header;
    # anything else falls back to a UUID built from the user's ID.
    preferredUserIdentifier: ""
  # Sets BRIDGE_USER_AUTH_SERVICE_ACCOUNT_TOKEN=true, for apiservers that
  # don't trust the OIDC issuer: requests to /api/kubernetes/ and /api/graphql
  # then authenticate with console's own service account token, impersonating
  # the logged-in user via Impersonate-User/-Group headers derived from the
  # session (the service account needs impersonate RBAC on users and groups,
  # which this chart doesn't grant). Client-requested impersonation, including
  # console's "Impersonate user" action, is refused in this mode. Every other
  # endpoint (plugins, monitoring, Helm, ...) keeps using the user's own token.
  serviceAccountToken: false
  # Sets BRIDGE_PLUGIN_IMPERSONATION=true, extending serviceAccountToken above
  # to the requests console proxies to plugin backends: /api/plugins/ requests
  # and the ConsolePlugin proxy routes that ask to be authorized then carry
  # console's service account token and the same session-derived
  # Impersonate-User/-Group headers, so a plugin backend can act as the
  # logged-in user. Client-requested impersonation is refused there too. Needs
  # serviceAccountToken: true to do anything; left off, plugin backends keep
  # receiving the user's own token.
  pluginImpersonation: false
  # Sets BRIDGE_USER_AUTH_OIDC_DEBUG_LOGS=true. Enables verbose OIDC
  # login/refresh flow tracing (backend klog + frontend browser console),
  # independent of -v verbosity.
  oidcDebugLogs: false
  # Cookie encryption/authentication keys bridge uses for its own session
  # cookies in OIDC mode (unused/unrendered in openshift mode, which relies
  # on OpenShift's OAuth server for session handling instead).
  cookieKeys:
    # Secret containing the keys below, mounted at
    # /etc/openshift-console/cookie and passed via
    # BRIDGE_COOKIE_*_KEY_FILE. Leave empty to skip the mount/env entirely.
    existingSecretName: ""
    encryptionKeyKey: encryption-key
    authenticationKeyKey: authentication-key

config:
  # Sets BRIDGE_PUBLIC_DIR when set. Only needed when the image's built-in
  # default doesn't already point at the right static-assets directory
  # (e.g. this repo's own containers/openshift-console build serves from
  # /opt/bridge/static, unlike quay.io/openshift/origin-console's default).
  publicDir: ""
  # http://0.0.0.0:9000 (plain) or https://0.0.0.0:8443 (TLS, the default
  # here since service.port/tls below assume HTTPS). The scheme prefix
  # here drives whether the chart wires up the serving-cert/TLS env vars at
  # all -- see templates/deployment.yaml -- so this is the single place to
  # flip between the two, rather than a separate listen.scheme value.
  listen: "https://0.0.0.0:8443"
  # Public URL users hit in their browser, as scheme://host[:port] -- bridge
  # ignores any path here, a sub-path goes in basePath. Leave empty to derive
  # from route.host (https://<route.host>) when route.create is true. Must be
  # set explicitly when route.create is false (e.g. ingress.httpRoute mode).
  baseAddress: ""
  # Sub-path console is served under (bridge's --base-path), e.g.
  # "/openshift-console/" for https://<host>/openshift-console/; missing
  # leading/trailing slashes are added. bridge serves every route below it, so
  # whatever sits in front must forward the prefix unchanged rather than strip
  # it. The chart moves the probe paths, the helm test, the Route/HTTPRoute
  # path match and the OAuthClient redirect URI under it; with auth.mode=oidc,
  # register <baseAddress><basePath>auth/callback at the IdP yourself. Other
  # apps served from the same host share console's origin and can use its
  # session, so prefer a dedicated host if that one is shared.
  basePath: "/"
  # One of: okd, openshift, ocp, online, dedicated, azure, rosa.
  branding: okd
  customProductName: ""
  documentationBaseUrl: ""
  statuspageId: ""
  # in-cluster is the only mode that makes sense for a real Deployment;
  # off-cluster is for `console/examples/run-bridge.sh`-style local dev.
  k8sMode: in-cluster
  k8sPublicEndpoint: ""
  techPreview: false
  # Sets BRIDGE_NODE_GROUPING_LABEL. When set, the nodes list view
  # (/k8s/cluster/nodes) groups nodes into collapsible sections keyed by this
  # label's value on each Node (nodes missing the label are grouped into a
  # trailing "no value" section). Leave empty (default) to keep the flat,
  # ungrouped list.
  nodeGroupingLabel: ""

# Sets BRIDGE_I18N_NAMESPACES (comma-joined). Every dynamic plugin below
# that ships its own translations needs its i18n namespace listed here too
# -- bridge only tells the frontend's i18next instance (public/i18n.js) to
# fetch a plugin's locale bundle at all when its namespace is in this list;
# it is NOT derived from `plugins` automatically. Leave a plugin's
# namespace out and every t() call against it logs "missing key" and falls
# back to the raw key, for every key, on every render -- harmless
# individually, but with dynamic-plugin nav labels re-resolving on every
# poll-console-updates.tsx tick (every 15s, upstream stock behavior) this
# adds up to real, continuous console.error() overhead in every open
# console tab. Each plugin's namespace is `plugin__<ConsolePlugin name>`
# (its Helm chart's consolePlugin.name/fullnameOverride, matching the
# `en/plugin__<name>.json` locale file each plugin repo ships) -- e.g.
# "plugin__cert-manager-console-plugin" for the chart at
# plugins/cert-manager/charts/console-cert-manager-plugin.
i18nNamespaces: []
# - plugin__cert-manager-console-plugin

# Dynamic plugins to enable, as name/url pairs -- rendered into
# BRIDGE_PLUGINS=name=url,name2=url2. Point each url at
# the ClusterIP Service of the matching plugin chart in this repo, e.g.
# "https://cert-manager-console-plugin.<ns>.svc:8080" for the chart at
# plugins/cert-manager/charts/console-cert-manager-plugin. Left empty by
# default so this chart doesn't hardcode cross-chart namespace assumptions;
# fill in per-environment, or set from an umbrella chart.
#
# An entry may also declare a `proxy`, which adds it to BRIDGE_PLUGIN_PROXY:
# console then proxies /api/proxy/plugin/<name>/<alias>/... to the plugin's
# backend, forwarding the logged-in user's credentials when `authorize` is
# true. Unlike the plugin-asset route, that path passes the request method,
# query string and body through untouched, so the plugins in this repo serve
# their REST APIs under it (alias "api", i.e. /api/proxy/plugin/<name>/api/v1/...)
# and need an entry here to work at all.
plugins: []
# - name: cert-manager-console-plugin
#   url: https://cert-manager-console-plugin.openshift-console.svc:8080
#   proxy:
#     # Path segment after the plugin name; the plugins here expect "api".
#     alias: api
#     # Forward the user's credentials (default true). The plugin backends in
#     # this repo read them instead of using their own ServiceAccount, so their
#     # ServiceAccounts hold no RBAC -- see each plugin chart's
#     # useServiceAccountToken value for the opt-out.
#     authorize: true
#     # Defaults to the url above; set only to reach the backend elsewhere.
#     url: ""
#     # PEM CA bundle for that endpoint; defaults to console's own
#     # --service-ca-file trust, same as plugin asset requests.
#     caCertificate: ""

# bridge's own metrics/health-check probes exercise a few APIs beyond what
# the "view" ClusterRole normally grants a regular user; monitoring.* below
# feeds the matching BRIDGE_THANOS_*/BRIDGE_ALERTMANAGER_*/
# BRIDGE_INTERNAL_PROTOCOL_SCHEME env vars when running against a monitoring
# stack that needs them. Left at "" here, they're skipped entirely (bridge's
# SetFlagsFromEnv only applies non-empty values) and bridge falls back to
# its own in-cluster CMO defaults.
monitoring:
  internalProtocolScheme: ""
  thanosHost: ""
  thanosTenancyHost: ""
  thanosTenancyForRulesHost: ""
  alertmanagerTenancyHost: ""
  alertmanagerUserWorkloadHost: ""
  alertmanagerHost: ""

# Gateway API alternative to route.* above, for fronting the console with a
# Gateway (e.g. Traefik) instead of an OpenShift Route. Only one of
# route.create / ingress.httpRoute.create is normally set at a time.
ingress:
  httpRoute:
    create: false
    annotations: {}
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
    parentRefs: []
    hostnames: []

# Extra cluster/namespace RBAC bridge itself needs beyond the "view"
# ClusterRole its ServiceAccount is normally bound to elsewhere.
extraRBAC:
  # ClusterRole/ClusterRoleBinding covering the consoleplugins/rolebindings
  # reads and subjectaccessreviews create bridge's own health/metrics
  # probing needs.
  metrics: true
  # ClusterRole/ClusterRoleBinding granting cluster-wide get/list/watch on
  # customresourcedefinitions. bridge's API discovery watches CRDs to keep
  # the frontend's model list current (and to re-run discovery when a CRD is
  # added or removed); without it every discovery sweep logs a forbidden CRD
  # watch and CRD-backed resources only appear after a reload.
  crds: true
  # Namespaced Role/RoleBinding bridge needs to create/manage its
  # per-user-settings ConfigMap+Role+RoleBinding at runtime.
  userSettings:
    enabled: true
    # Defaults to .Release.Namespace when empty.
    namespace: ""

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# httpGet.path is relative to config.basePath: the chart moves it under that.
livenessProbe:
  httpGet:
    path: /health
    port: https
    scheme: HTTPS
readinessProbe:
  httpGet:
    path: /health
    port: https
    scheme: HTTPS

nodeSelector: {}
tolerations: []
affinity: {}

# Arbitrary additional manifests to render as part of this release. Lets a
# 3rd party bring its own resources alongside the console without a second
# Helm release -- e.g. an ExternalSecret that populates the Secret named by
# auth.cookieKeys.existingSecretName or auth.oidc.existingSecretName, so the
# whole chain (external secret manager -> k8s Secret -> this chart's
# existingSecretName) lives in one place. Each entry is rendered through
# `tpl`, so it may reference .Values/.Release/.Chart/etc. like any other
# chart template; write it exactly as the target manifest's YAML.
#
# Example:
#   extraManifests:
#     - apiVersion: external-secrets.io/v1
#       kind: ExternalSecret
#       metadata:
#         name: openshift-console-cookie-keys
#       spec:
#         secretStoreRef:
#           name: vault
#           kind: ClusterSecretStore
#         target:
#           name: openshift-console-cookie-keys
#         data:
#           - secretKey: encryption-key
#             remoteRef:
#               key: secret/openshift-console/cookie-keys
#               property: encryption-key
#           - secretKey: authentication-key
#             remoteRef:
#               key: secret/openshift-console/cookie-keys
#               property: authentication-key
extraManifests: []
