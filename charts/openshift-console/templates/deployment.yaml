apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- with .Values.config.publicDir }}
            - --public-dir={{ . }}
            {{- end }}
            - --listen={{ .Values.config.listen }}
            - --base-address=$(CONFIG_BASE_ADDRESS)
            - --base-path={{ .Values.config.basePath }}
            {{- if .Values.serviceCa.enabled }}
            - --service-ca-file=/var/run/configmaps/service-ca/service-ca.crt
            {{- end }}
            - --k8s-mode={{ .Values.config.k8sMode }}
            {{- with .Values.config.k8sPublicEndpoint }}
            - --k8s-public-endpoint={{ . }}
            {{- end }}
            {{- if eq (include "console.listenScheme" .) "https" }}
            - --tls-cert-file=/var/run/secrets/serving-cert/tls.crt
            - --tls-key-file=/var/run/secrets/serving-cert/tls.key
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - --user-auth=oidc
            - --user-auth-oidc-issuer-url=$(AUTH_OIDC_ISSUER_URL)
            - --user-auth-oidc-client-id=$(AUTH_OIDC_CLIENT_ID)
            - --user-auth-oidc-token-scopes=$(AUTH_OIDC_TOKEN_SCOPES)
            {{- with .Values.auth.oidc.existingSecretName }}
            - --user-auth-oidc-client-secret-file=/etc/openshift-console/oidc/{{ $.Values.auth.oidc.secretKey }}
            {{- end }}
            {{- with .Values.auth.cookieKeys.existingSecretName }}
            - --cookie-encryption-key-file=/etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.encryptionKeyKey }}
            - --cookie-authentication-key-file=/etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.authenticationKeyKey }}
            {{- end }}
            # These are set via env vars (below) rather than templated
            # directly into the value, so operators can configure them the
            # same way as any other cluster deployment setting -- e.g.
            # `kubectl set env`, a ConfigMap/Secret, or a kustomize overlay --
            # without touching the Helm release. Kubernetes substitutes
            # $(NAME) from this container's own env list before exec'ing the
            # command, so bridge itself still only ever sees a plain flag.
            - --user-auth-kubeadmin-group-name=$(AUTH_KUBEADMIN_GROUP_NAME)
            - --user-auth-oidc-group-matcher=$(AUTH_OIDC_GROUP_MATCHER)
            - --user-auth-oidc-exclude-group-matcher=$(AUTH_OIDC_EXCLUDE_GROUP_MATCHER)
            - --user-auth-preferred-user-identifier=$(AUTH_PREFERRED_USER_IDENTIFIER)
            - --user-auth-service-account-token=$(AUTH_SERVICE_ACCOUNT_TOKEN)
            - --user-auth-oidc-debug-logs=$(AUTH_OIDC_DEBUG_LOGS)
            {{- else }}
            - --user-auth=openshift
            - --user-auth-oidc-client-id={{ .Values.oauthClient.name }}
            - --user-auth-oidc-client-secret-file=/var/run/secrets/oauth-client/clientSecret
            {{- end }}
            - --branding={{ .Values.config.branding }}
            {{- with .Values.config.customProductName }}
            - --custom-product-name={{ . }}
            {{- end }}
            {{- with .Values.config.documentationBaseUrl }}
            - --documentation-base-url={{ . }}
            {{- end }}
            {{- with .Values.config.statuspageId }}
            - --statuspage-id={{ . }}
            {{- end }}
            {{- if .Values.config.techPreview }}
            - --tech-preview=true
            {{- end }}
            {{- with .Values.plugins }}
            - --plugins={{ range $i, $p := . }}{{ if $i }},{{ end }}{{ $p.name }}={{ $p.url }}{{ end }}
            {{- end }}
            {{- with .Values.monitoring.internalProtocolScheme }}
            - --internal-protocol-scheme={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosHost }}
            - --thanos-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosTenancyHost }}
            - --thanos-tenancy-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosTenancyForRulesHost }}
            - --thanos-tenancy-for-rules-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerTenancyHost }}
            - --alertmanager-tenancy-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerUserWorkloadHost }}
            - --alertmanager-user-workload-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerHost }}
            - --alertmanager-host={{ . }}
            {{- end }}
          env:
            # Backs the --base-address=$(...) arg above. Always defined (even
            # at its zero value) since an undefined $(NAME) is left as a
            # literal, unexpanded string in the arg instead of "".
            - name: CONFIG_BASE_ADDRESS
              value: {{ include "console.baseAddress" . | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: AUTH_OIDC_ISSUER_URL
              value: {{ .Values.auth.oidc.issuerUrl | quote }}
            - name: AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: AUTH_OIDC_TOKEN_SCOPES
              value: {{ join "," .Values.auth.oidc.tokenScopes | quote }}
            # Back the $(...)-substituted args above. Always defined (even at
            # their zero value) since an undefined $(NAME) is left as a
            # literal, unexpanded string in the arg instead of "".
            - name: AUTH_KUBEADMIN_GROUP_NAME
              value: {{ .Values.auth.oidc.kubeadminGroupName | quote }}
            - name: AUTH_OIDC_GROUP_MATCHER
              value: {{ .Values.auth.oidc.groupMatcher | quote }}
            - name: AUTH_OIDC_EXCLUDE_GROUP_MATCHER
              value: {{ .Values.auth.oidc.excludeGroupMatcher | quote }}
            - name: AUTH_PREFERRED_USER_IDENTIFIER
              value: {{ .Values.auth.oidc.preferredUserIdentifier | quote }}
            - name: AUTH_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.auth.serviceAccountToken | toString | quote }}
            - name: AUTH_OIDC_DEBUG_LOGS
              value: {{ .Values.auth.oidcDebugLogs | toString | quote }}
            {{- end }}
          ports:
            - name: {{ include "console.listenScheme" . }}
              containerPort: {{ include "console.listenPort" . }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $isHttps := eq (include "console.listenScheme" .) "https" }}
          {{- $openshiftAuth := and (eq .Values.auth.mode "openshift") .Values.oauthClient.create }}
          {{- $oidcClientSecret := and (eq .Values.auth.mode "oidc") .Values.auth.oidc.existingSecretName }}
          {{- $cookieKeys := and (eq .Values.auth.mode "oidc") .Values.auth.cookieKeys.existingSecretName }}
          {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $oidcClientSecret $cookieKeys }}
          volumeMounts:
            {{- if $isHttps }}
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
            {{- end }}
            {{- if .Values.serviceCa.enabled }}
            - name: service-ca
              mountPath: /var/run/configmaps/service-ca
              readOnly: true
            {{- end }}
            {{- if $openshiftAuth }}
            - name: oauth-client-secret
              mountPath: /var/run/secrets/oauth-client
              readOnly: true
            {{- end }}
            {{- if $oidcClientSecret }}
            - name: oidc-client-secret
              mountPath: /etc/openshift-console/oidc
              readOnly: true
            {{- end }}
            {{- if $cookieKeys }}
            - name: cookie-keys
              mountPath: /etc/openshift-console/cookie
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $oidcClientSecret $cookieKeys }}
      volumes:
        {{- if $isHttps }}
        - name: serving-cert
          secret:
            secretName: {{ include "console.servingCertSecretName" . }}
        {{- end }}
        {{- if .Values.serviceCa.enabled }}
        - name: service-ca
          configMap:
            name: {{ include "console.fullname" . }}-service-ca
        {{- end }}
        {{- if $openshiftAuth }}
        - name: oauth-client-secret
          secret:
            secretName: {{ include "console.oauthClientSecretName" . }}
        {{- end }}
        {{- if $oidcClientSecret }}
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.auth.oidc.existingSecretName }}
        {{- end }}
        {{- if $cookieKeys }}
        - name: cookie-keys
          secret:
            secretName: {{ .Values.auth.cookieKeys.existingSecretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
