apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # bridge reads every flag it registers from a same-named
          # BRIDGE_<FLAG-NAME, dashes-to-underscores, upper-cased> env var
          # (github.com/coreos/pkg/flagutil.SetFlagsFromEnv, called with
          # prefix "BRIDGE" from cmd/bridge/main.go before flag parsing) --
          # this isn't a Kubernetes $(...) substitution trick, bridge itself
          # checks os.Getenv for each flag it doesn't see on argv. An empty
          # env var is skipped (falls back to the flag's own default), so
          # config left at its Helm zero-value behaves the same as omitting
          # the flag entirely. This lets every setting below be changed
          # post-deploy the same way as any other cluster deployment setting
          # -- e.g. `kubectl set env`, a ConfigMap/Secret, or a kustomize
          # overlay -- without touching the Helm release, and keeps actual
          # values (issuer URLs, internal hostnames, etc.) out of `args`
          # entirely rather than just out of the rendered chart. `args: []`
          # below only exists to blank out the image's own baked CMD so it
          # can't reintroduce a flag out from under this env-var config.
          args: []
          env:
            - name: BRIDGE_PUBLIC_DIR
              value: {{ .Values.config.publicDir | quote }}
            - name: BRIDGE_LISTEN
              value: {{ .Values.config.listen | quote }}
            - name: BRIDGE_BASE_ADDRESS
              value: {{ include "console.baseAddress" . | quote }}
            - name: BRIDGE_BASE_PATH
              value: {{ .Values.config.basePath | quote }}
            - name: BRIDGE_K8S_MODE
              value: {{ .Values.config.k8sMode | quote }}
            - name: BRIDGE_K8S_PUBLIC_ENDPOINT
              value: {{ .Values.config.k8sPublicEndpoint | quote }}
            {{- if .Values.serviceCa.enabled }}
            - name: BRIDGE_SERVICE_CA_FILE
              value: /var/run/configmaps/service-ca/service-ca.crt
            {{- end }}
            {{- if eq (include "console.listenScheme" .) "https" }}
            - name: BRIDGE_TLS_CERT_FILE
              value: /var/run/secrets/serving-cert/tls.crt
            - name: BRIDGE_TLS_KEY_FILE
              value: /var/run/secrets/serving-cert/tls.key
            {{- end }}
            - name: BRIDGE_USER_AUTH
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: BRIDGE_USER_AUTH_OIDC_ISSUER_URL
              value: {{ .Values.auth.oidc.issuerUrl | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_TOKEN_SCOPES
              value: {{ join "," .Values.auth.oidc.tokenScopes | quote }}
            {{- with .Values.auth.oidc.existingSecretName }}
            - name: BRIDGE_USER_AUTH_OIDC_CLIENT_SECRET_FILE
              value: /etc/openshift-console/oidc/{{ $.Values.auth.oidc.secretKey }}
            {{- end }}
            - name: BRIDGE_USER_AUTH_KUBEADMIN_GROUP_NAME
              value: {{ .Values.auth.oidc.kubeadminGroupName | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_GROUP_MATCHER
              value: {{ .Values.auth.oidc.groupMatcher | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_EXCLUDE_GROUP_MATCHER
              value: {{ .Values.auth.oidc.excludeGroupMatcher | quote }}
            - name: BRIDGE_USER_AUTH_PREFERRED_USER_IDENTIFIER
              value: {{ .Values.auth.oidc.preferredUserIdentifier | quote }}
            - name: BRIDGE_USER_AUTH_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.auth.serviceAccountToken | toString | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_DEBUG_LOGS
              value: {{ .Values.auth.oidcDebugLogs | toString | quote }}
            {{- with .Values.auth.cookieKeys.existingSecretName }}
            - name: BRIDGE_COOKIE_ENCRYPTION_KEY_FILE
              value: /etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.encryptionKeyKey }}
            - name: BRIDGE_COOKIE_AUTHENTICATION_KEY_FILE
              value: /etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.authenticationKeyKey }}
            {{- end }}
            {{- else }}
            - name: BRIDGE_USER_AUTH_OIDC_CLIENT_ID
              value: {{ .Values.oauthClient.name | quote }}
            - name: BRIDGE_USER_AUTH_OIDC_CLIENT_SECRET_FILE
              value: /var/run/secrets/oauth-client/clientSecret
            {{- end }}
            - name: BRIDGE_BRANDING
              value: {{ .Values.config.branding | quote }}
            - name: BRIDGE_CUSTOM_PRODUCT_NAME
              value: {{ .Values.config.customProductName | quote }}
            - name: BRIDGE_DOCUMENTATION_BASE_URL
              value: {{ .Values.config.documentationBaseUrl | quote }}
            - name: BRIDGE_STATUSPAGE_ID
              value: {{ .Values.config.statuspageId | quote }}
            - name: BRIDGE_TECH_PREVIEW
              value: {{ .Values.config.techPreview | toString | quote }}
            - name: BRIDGE_NODE_GROUPING_LABEL
              value: {{ .Values.config.nodeGroupingLabel | quote }}
            {{- with .Values.plugins }}
            - name: BRIDGE_PLUGINS
              value: {{ range $i, $p := . }}{{ if $i }},{{ end }}{{ $p.name }}={{ $p.url }}{{ end }}
            {{- end }}
            - name: BRIDGE_INTERNAL_PROTOCOL_SCHEME
              value: {{ .Values.monitoring.internalProtocolScheme | quote }}
            - name: BRIDGE_THANOS_HOST
              value: {{ .Values.monitoring.thanosHost | quote }}
            - name: BRIDGE_THANOS_TENANCY_HOST
              value: {{ .Values.monitoring.thanosTenancyHost | quote }}
            - name: BRIDGE_THANOS_TENANCY_FOR_RULES_HOST
              value: {{ .Values.monitoring.thanosTenancyForRulesHost | quote }}
            - name: BRIDGE_ALERTMANAGER_TENANCY_HOST
              value: {{ .Values.monitoring.alertmanagerTenancyHost | quote }}
            - name: BRIDGE_ALERTMANAGER_USER_WORKLOAD_HOST
              value: {{ .Values.monitoring.alertmanagerUserWorkloadHost | quote }}
            - name: BRIDGE_ALERTMANAGER_HOST
              value: {{ .Values.monitoring.alertmanagerHost | quote }}
          ports:
            - name: {{ include "console.listenScheme" . }}
              containerPort: {{ include "console.listenPort" . }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $isHttps := eq (include "console.listenScheme" .) "https" }}
          {{- $openshiftAuth := and (eq .Values.auth.mode "openshift") .Values.oauthClient.create }}
          {{- $oidcClientSecret := and (eq .Values.auth.mode "oidc") .Values.auth.oidc.existingSecretName }}
          {{- $cookieKeys := and (eq .Values.auth.mode "oidc") .Values.auth.cookieKeys.existingSecretName }}
          {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $oidcClientSecret $cookieKeys }}
          volumeMounts:
            {{- if $isHttps }}
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
            {{- end }}
            {{- if .Values.serviceCa.enabled }}
            - name: service-ca
              mountPath: /var/run/configmaps/service-ca
              readOnly: true
            {{- end }}
            {{- if $openshiftAuth }}
            - name: oauth-client-secret
              mountPath: /var/run/secrets/oauth-client
              readOnly: true
            {{- end }}
            {{- if $oidcClientSecret }}
            - name: oidc-client-secret
              mountPath: /etc/openshift-console/oidc
              readOnly: true
            {{- end }}
            {{- if $cookieKeys }}
            - name: cookie-keys
              mountPath: /etc/openshift-console/cookie
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $oidcClientSecret $cookieKeys }}
      volumes:
        {{- if $isHttps }}
        - name: serving-cert
          secret:
            secretName: {{ include "console.servingCertSecretName" . }}
        {{- end }}
        {{- if .Values.serviceCa.enabled }}
        - name: service-ca
          configMap:
            name: {{ include "console.fullname" . }}-service-ca
        {{- end }}
        {{- if $openshiftAuth }}
        - name: oauth-client-secret
          secret:
            secretName: {{ include "console.oauthClientSecretName" . }}
        {{- end }}
        {{- if $oidcClientSecret }}
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.auth.oidc.existingSecretName }}
        {{- end }}
        {{- if $cookieKeys }}
        - name: cookie-keys
          secret:
            secretName: {{ .Values.auth.cookieKeys.existingSecretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
