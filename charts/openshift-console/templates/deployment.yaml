apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- with .Values.config.publicDir }}
            - --public-dir={{ . }}
            {{- end }}
            - --listen={{ .Values.config.listen }}
            {{- with (include "console.baseAddress" .) }}
            - --base-address={{ . }}
            {{- end }}
            - --base-path={{ .Values.config.basePath }}
            {{- if .Values.serviceCa.enabled }}
            - --service-ca-file=/var/run/configmaps/service-ca/service-ca.crt
            {{- end }}
            - --k8s-mode={{ .Values.config.k8sMode }}
            {{- with .Values.config.k8sPublicEndpoint }}
            - --k8s-public-endpoint={{ . }}
            {{- end }}
            {{- if eq (include "console.listenScheme" .) "https" }}
            - --tls-cert-file=/var/run/secrets/serving-cert/tls.crt
            - --tls-key-file=/var/run/secrets/serving-cert/tls.key
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - --user-auth=oidc
            - --user-auth-oidc-issuer-url={{ .Values.auth.oidc.issuerUrl }}
            - --user-auth-oidc-client-id={{ .Values.auth.oidc.clientId }}
            {{- with .Values.auth.oidc.tokenScopes }}
            - --user-auth-oidc-token-scopes={{ join "," . }}
            {{- end }}
            {{- with .Values.auth.cookieKeys.existingSecretName }}
            - --cookie-encryption-key-file=/etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.encryptionKeyKey }}
            - --cookie-authentication-key-file=/etc/openshift-console/cookie/{{ $.Values.auth.cookieKeys.authenticationKeyKey }}
            {{- end }}
            {{- with .Values.auth.oidc.kubeadminGroupName }}
            - --user-auth-kubeadmin-group-name={{ . }}
            {{- end }}
            {{- with .Values.auth.oidc.groupMatcher }}
            - --user-auth-oidc-group-matcher={{ . }}
            {{- end }}
            {{- with .Values.auth.oidc.excludeGroupMatcher }}
            - --user-auth-oidc-exclude-group-matcher={{ . }}
            {{- end }}
            {{- with .Values.auth.oidc.preferredUserIdentifier }}
            - --user-auth-preferred-user-identifier={{ . }}
            {{- end }}
            {{- if .Values.auth.serviceAccountToken }}
            - --user-auth-service-account-token=true
            {{- end }}
            {{- if .Values.auth.oidcDebugLogs }}
            - --user-auth-oidc-debug-logs=true
            {{- end }}
            {{- else }}
            - --user-auth=openshift
            - --user-auth-oidc-client-id={{ .Values.oauthClient.name }}
            - --user-auth-oidc-client-secret-file=/var/run/secrets/oauth-client/clientSecret
            {{- end }}
            - --branding={{ .Values.config.branding }}
            {{- with .Values.config.customProductName }}
            - --custom-product-name={{ . }}
            {{- end }}
            {{- with .Values.config.documentationBaseUrl }}
            - --documentation-base-url={{ . }}
            {{- end }}
            {{- with .Values.config.statuspageId }}
            - --statuspage-id={{ . }}
            {{- end }}
            {{- if .Values.config.techPreview }}
            - --tech-preview=true
            {{- end }}
            {{- with .Values.plugins }}
            - --plugins={{ range $i, $p := . }}{{ if $i }},{{ end }}{{ $p.name }}={{ $p.url }}{{ end }}
            {{- end }}
            {{- with .Values.monitoring.internalProtocolScheme }}
            - --internal-protocol-scheme={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosHost }}
            - --thanos-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosTenancyHost }}
            - --thanos-tenancy-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.thanosTenancyForRulesHost }}
            - --thanos-tenancy-for-rules-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerTenancyHost }}
            - --alertmanager-tenancy-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerUserWorkloadHost }}
            - --alertmanager-user-workload-host={{ . }}
            {{- end }}
            {{- with .Values.monitoring.alertmanagerHost }}
            - --alertmanager-host={{ . }}
            {{- end }}
          {{- if eq .Values.auth.mode "oidc" }}
          env:
            {{- with .Values.auth.oidc.existingSecretName }}
            - name: BRIDGE_USER_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.oidc.secretKey }}
            {{- end }}
          {{- end }}
          ports:
            - name: {{ include "console.listenScheme" . }}
              containerPort: {{ include "console.listenPort" . }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $isHttps := eq (include "console.listenScheme" .) "https" }}
          {{- $openshiftAuth := and (eq .Values.auth.mode "openshift") .Values.oauthClient.create }}
          {{- $cookieKeys := and (eq .Values.auth.mode "oidc") .Values.auth.cookieKeys.existingSecretName }}
          {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $cookieKeys }}
          volumeMounts:
            {{- if $isHttps }}
            - name: serving-cert
              mountPath: /var/run/secrets/serving-cert
              readOnly: true
            {{- end }}
            {{- if .Values.serviceCa.enabled }}
            - name: service-ca
              mountPath: /var/run/configmaps/service-ca
              readOnly: true
            {{- end }}
            {{- if $openshiftAuth }}
            - name: oauth-client-secret
              mountPath: /var/run/secrets/oauth-client
              readOnly: true
            {{- end }}
            {{- if $cookieKeys }}
            - name: cookie-keys
              mountPath: /etc/openshift-console/cookie
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $isHttps .Values.serviceCa.enabled $openshiftAuth $cookieKeys }}
      volumes:
        {{- if $isHttps }}
        - name: serving-cert
          secret:
            secretName: {{ include "console.servingCertSecretName" . }}
        {{- end }}
        {{- if .Values.serviceCa.enabled }}
        - name: service-ca
          configMap:
            name: {{ include "console.fullname" . }}-service-ca
        {{- end }}
        {{- if $openshiftAuth }}
        - name: oauth-client-secret
          secret:
            secretName: {{ include "console.oauthClientSecretName" . }}
        {{- end }}
        {{- if $cookieKeys }}
        - name: cookie-keys
          secret:
            secretName: {{ .Values.auth.cookieKeys.existingSecretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
