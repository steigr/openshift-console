{{- if .Values.route.create }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  {{- if ne (include "console.basePath" .) "/" }}
  path: {{ include "console.basePath" . | trimSuffix "/" }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "console.fullname" . }}
  port:
    targetPort: https
  tls:
    termination: {{ .Values.route.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.insecureEdgeTerminationPolicy }}
{{- end }}
