{{- include "console-dashboard-recording-rules.assertDetected" . }}
{{- if eq (include "console-dashboard-recording-rules.useVictoriaMetrics" .) "true" }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "console-dashboard-recording-rules.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespaceOverride }}
  labels:
    {{- include "console-dashboard-recording-rules.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- include "console-dashboard-recording-rules.groups" . | nindent 4 }}
{{- end }}
