## Namespace-less by default: the rule resource is created in the release namespace.
## Override if your PrometheusRule/VMRule operator selects rules from a specific namespace only.
namespaceOverride: ""

## Extra labels merged onto the rule resource so your operator's ruleSelector picks it up
## (e.g. VictoriaMetrics vmoperator's `ruleSelector`/`ruleNamespaceSelector`,
## or prometheus-operator's `ruleSelector`).
labels: {}
  # prometheus: victoria-metrics
  # role: recording-rules

## Which CRD(s) to render. When autoDetect is true (the default), prometheus/
## victoriaMetrics below are ignored: the chart renders a VMRule if the VMRule
## CRD (operator.victoriametrics.com/v1beta1) is present, else a PrometheusRule
## if that CRD (monitoring.coreos.com/v1) is present, else the release fails.
## VictoriaMetrics is preferred over Prometheus when both CRDs are present.
##
## Set autoDetect to false to control rendering explicitly instead - either or
## both of prometheus/victoriaMetrics may be enabled to render both resources.
autoDetect: true
prometheus: false
victoriaMetrics: false

## Individual rule groups can be disabled if you only need one.
rules:
  nodeExporter: true
  clusterMonitoringOperator: true
