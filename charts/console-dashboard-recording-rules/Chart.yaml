apiVersion: v2
description: >-
  Upstream cluster-monitoring-operator recording rules needed by the OpenShift
  Console "Overview" dashboard (network transfer, pod count), deployed as a
  plain PrometheusRule for clusters that don't run cluster-monitoring-operator
  itself (e.g. VictoriaMetrics-backed monitoring stacks).
