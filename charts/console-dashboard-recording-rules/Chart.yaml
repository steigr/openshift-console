apiVersion: v2
description: >-
  Upstream cluster-monitoring-operator recording rules needed by the OpenShift
  Console "Overview" dashboard (network transfer, pod count), for clusters
  that don't run cluster-monitoring-operator itself. Renders as a
  PrometheusRule or a VictoriaMetrics VMRule depending on which CRD is
  present in the cluster (auto-detected by default, see values.yaml).
icon: https://github.com/openshift/console/raw/master/frontend/public/imgs/logos/openshift.svg
keywords:
  - openshift-console
  - prometheus
  - victoriametrics
  - recording-rules
kubeVersion: '>=1.16.0-0'
name: console-dashboard-recording-rules
type: application
version: 0.2.0
