name: Publish Helm charts

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.chart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - charts/openshift-console
          - charts/openshift-console-crds
          - plugins/cert-manager/charts/console-cert-manager-plugin
          - plugins/external-dns/charts/console-external-dns-plugin
          - plugins/external-secrets/charts/console-external-secrets-plugin
          - plugins/flux/charts/console-flux-plugin
          - plugins/kubevirt/charts/console-kubevirt-plugin
          - plugins/monitoring/charts/console-monitoring-plugin
          - plugins/networking/charts/console-networking-plugin
          - plugins/node-logging/charts/console-node-logging-plugin
          - plugins/node-terminal/charts/node-terminal
          - plugins/openshift-synchronizer/charts/openshift-synchronizer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Repository owner (lowercase)
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Lint chart
        run: helm lint "${{ matrix.chart }}"

      - name: Compute, package and push chart
        run: |
          set -uo pipefail

          chart_name=$(yq -r '.name' "${{ matrix.chart }}/Chart.yaml")
          chart_ref="ghcr.io/${{ steps.owner.outputs.owner }}/charts/${chart_name}"

          # NOTICE: GHCR OCI tags are mutable by default, so a lost race between two concurrent
          # runs for the same chart isn't guaranteed to surface as a push failure -- it can
          # silently overwrite instead. This loop shrinks the window and retries on real
          # failures, but does not give hard collision-proof guarantees.
          max_attempts=5
          attempt=1

          while true; do
            # Re-read the registry every attempt so version and push stay as close together
            # in time as possible -- this is the check that must match what we're about to push.
            existing_tags=$(oras repo tags "${chart_ref}" 2>/dev/null || true)

            # Highest already-released version (plain X.Y.Z, no prerelease suffix).
            latest_release=$(printf '%s\n' "${existing_tags}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

            app_version=""
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              # Release: use the chart's own declared version; publish only if it's not already out.
              version=$(yq -r '.version' "${{ matrix.chart }}/Chart.yaml")

              if printf '%s\n' "${existing_tags}" | grep -qx "${version}"; then
                echo "${chart_name}:${version} is already published, skipping"
                exit 0
              fi
            else
              # Pre-release: bump the patch of the latest released version, then find the next
              # free publication number N for that X.Y.Z-N. The git sha only goes into
              # app-version/metadata, never into the tag, so `helm pull ...:X.Y.Z-N` works.
              base="${latest_release:-0.0.0}"
              IFS='.' read -r major minor patch <<< "${base}"
              next="${major}.${minor}.$((patch + 1))"

              escaped_next=$(printf '%s' "${next}" | sed 's/\./\\./g')
              max_n=$(printf '%s\n' "${existing_tags}" \
                | grep -E "^${escaped_next}-[0-9]+$" \
                | sed -E "s/^${escaped_next}-([0-9]+)$/\1/" \
                | sort -n | tail -n1 || true)
              n=$(( ${max_n:-0} + 1 ))

              version="${next}-${n}"
              app_version="git-$(git rev-parse --short HEAD)"
            fi

            rm -rf /tmp/charts && mkdir -p /tmp/charts
            if [[ -n "${app_version}" ]]; then
              helm package "${{ matrix.chart }}" --version "${version}" --app-version "${app_version}" --destination /tmp/charts
            else
              helm package "${{ matrix.chart }}" --version "${version}" --destination /tmp/charts
            fi

            if helm push /tmp/charts/*.tgz "oci://ghcr.io/${{ steps.owner.outputs.owner }}/charts"; then
              echo "pushed ${chart_name}:${version}"
              exit 0
            fi

            if (( attempt >= max_attempts )); then
              echo "giving up on ${chart_name} after ${attempt} attempts" >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "push failed, retrying with a fresh version (attempt ${attempt}/${max_attempts})..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
