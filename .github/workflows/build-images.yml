name: Build and push container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    # Only meaningful for a normal branch push -- a tag push is a release (build
    # everything) and workflow_dispatch is a manual, explicit rebuild request.
    if: github.event_name == 'push' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      console: ${{ steps.filter.outputs.console }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      networking: ${{ steps.filter.outputs.networking }}
      kubevirt: ${{ steps.filter.outputs.kubevirt }}
      external-secrets: ${{ steps.filter.outputs['external-secrets'] }}
      node-logging: ${{ steps.filter.outputs['node-logging'] }}
      external-dns: ${{ steps.filter.outputs['external-dns'] }}
      cert-manager: ${{ steps.filter.outputs['cert-manager'] }}
      flux: ${{ steps.filter.outputs.flux }}
      vncviewer: ${{ steps.filter.outputs.vncviewer }}
      node-terminal: ${{ steps.filter.outputs['node-terminal'] }}
      openshift-synchronizer: ${{ steps.filter.outputs['openshift-synchronizer'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Required because filters combine positive globs with a '!.../charts/**'
          # exclusion: under the default 'some' quantifier, paths-filter evaluates each
          # pattern (including negated ones) independently with OR logic, so a standalone
          # '!plugins/x/charts/**' matches almost every file in the repo (anything not
          # under that charts dir) and makes every filter spuriously true. This quantifier
          # is the one that actually treats '!' patterns as exclusions from the OR'd matches.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            console:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'patches/**'
              - 'containers/openshift-console/Dockerfile'
            monitoring:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/monitoring/**'
              - '!plugins/monitoring/charts/**'
            networking:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/networking/**'
              - '!plugins/networking/charts/**'
            kubevirt:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/kubevirt/**'
              - '!plugins/kubevirt/charts/**'
            external-secrets:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/external-secrets/**'
              - '!plugins/external-secrets/charts/**'
            node-logging:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/node-logging/**'
              - '!plugins/node-logging/charts/**'
            external-dns:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/external-dns/**'
              - '!plugins/external-dns/charts/**'
            cert-manager:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/cert-manager/**'
              - '!plugins/cert-manager/charts/**'
            flux:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/flux/**'
              - '!plugins/flux/charts/**'
            vncviewer:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/vncviewer/**'
              - '!plugins/vncviewer/charts/**'
            node-terminal:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/node-terminal/**'
              - '!plugins/node-terminal/charts/**'
            openshift-synchronizer:
              - 'Makefile'
              - 'config.mk'
              - '.github/workflows/build-images.yml'
              - 'plugins/openshift-synchronizer/**'
              - '!plugins/openshift-synchronizer/charts/**'

  build:
    needs: changes
    if: always()
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            target: push-console
            image_var: CONSOLE_IMAGE
            image_name: openshift-console
            mise: true
          - name: monitoring
            target: push-monitoring
            image_var: MONITORING_PLUGIN_IMAGE
            image_name: console-monitoring-plugin
            mise: false
          - name: networking
            target: push-networking
            image_var: NETWORKING_PLUGIN_IMAGE
            image_name: console-networking-plugin
            mise: false
          - name: kubevirt
            target: push-kubevirt
            image_var: KUBEVIRT_PLUGIN_IMAGE
            image_name: console-kubevirt-plugin
            mise: false
          - name: external-secrets
            target: push-external-secrets
            image_var: EXTERNAL_SECRETS_PLUGIN_IMAGE
            image_name: console-external-secrets-plugin
            mise: false
          - name: node-logging
            target: push-node-logging
            image_var: NODE_LOGGING_PLUGIN_IMAGE
            image_name: console-node-logging-plugin
            mise: false
          - name: external-dns
            target: push-external-dns
            image_var: EXTERNAL_DNS_PLUGIN_IMAGE
            image_name: console-external-dns-plugin
            mise: false
          - name: cert-manager
            target: push-cert-manager
            image_var: CERT_MANAGER_PLUGIN_IMAGE
            image_name: console-cert-manager-plugin
            mise: false
          - name: flux
            target: push-flux
            image_var: FLUX_PLUGIN_IMAGE
            image_name: console-flux-plugin
            mise: false
          - name: vncviewer
            target: push-vncviewer
            image_var: VNCVIEWER_PLUGIN_IMAGE
            image_name: console-vncviewer-plugin
            mise: false
          - name: node-terminal
            target: push-node-terminal
            image_var: NODE_TERMINAL_IMAGE
            image_name: node-terminal-shim
            mise: false
            multi_arch: true
          - name: openshift-synchronizer
            target: push-openshift-synchronizer
            image_var: OPENSHIFT_SYNCHRONIZER_IMAGE
            image_name: openshift-synchronizer
            mise: false
    steps:
      - name: Determine whether this component needs to build
        id: gate
        run: |
          if [[ "${{ needs.changes.result }}" == "skipped" || "${{ needs.changes.outputs[matrix.name] }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.name }}: no relevant changes, skipping"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: steps.gate.outputs.run == 'true' && matrix.multi_arch
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Install mise
        if: steps.gate.outputs.run == 'true' && matrix.mise
        uses: jdx/mise-action@v4

      - name: Repository owner (lowercase)
        if: steps.gate.outputs.run == 'true'
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        if: steps.gate.outputs.run == 'true'
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=git-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.name }}
        if: steps.gate.outputs.run == 'true'
        run: |
          make ${{ matrix.target }} \
            ${{ matrix.image_var }}=ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }} \
            TAG=${{ steps.vars.outputs.tag }}

      - name: Also tag latest (main, non-release builds)
        if: steps.gate.outputs.run == 'true' && github.ref_type != 'tag' && github.ref_name == 'main'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:latest \
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:${{ steps.vars.outputs.tag }}
