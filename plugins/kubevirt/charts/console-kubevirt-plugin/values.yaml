# Default values for console-kubevirt-plugin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: steigr/console-kubevirt-plugin
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Pin by digest instead (full "sha256:..." string). When set, this takes
  # precedence over tag/appVersion and the image is referenced as
  # "repository@sha256:...".
  digest: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  name: http
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# Note: no explicit healthz route was found in plugins/kubevirt/main.go or api/*.go; the backend
# only serves the embedded static frontend plus any registered API routes, so "/" (the static
# index) is used as the probe path.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

# ConsolePlugin custom resource registering this backend Service with the OpenShift console.
consolePlugin:
  create: true
  displayName: "KubeVirt console plugin"

# Monitoring resources for clusters where KubeVirt isn't managed by the real
# hyperconverged-cluster-operator (HCO) - i.e. bare community KubeVirt. Without
# these, the OpenShift console's "OpenShift Virtualization" dashboard status
# card queries kubevirt_hyperconverged_operator_health_status (HCO-only) and
# shows Degraded even when KubeVirt itself is healthy, because that metric
# never exists and no KubeVirt component metrics are scraped at all by default.
monitoring:
  enabled: true

  # Which CRD flavor to render. When autoDetect is true (the default), prometheus/
  # victoriaMetrics below are ignored: renders VMRule/VMServiceScrape if the VMRule
  # CRD (operator.victoriametrics.com/v1beta1) is present, else PrometheusRule/
  # ServiceMonitor if that CRD (monitoring.coreos.com/v1) is present, else the
  # release fails. VictoriaMetrics is preferred when both CRDs are present.
  #
  # Set autoDetect to false to control rendering explicitly instead - either or
  # both of prometheus/victoriaMetrics may be enabled to render both resources.
  autoDetect: true
  prometheus: false
  victoriaMetrics: false

  # Namespace-less by default: rule/scrape resources are created in the release
  # namespace. Override if your operator only selects resources from a specific
  # namespace.
  namespaceOverride: ""

  # Extra labels merged onto every rendered resource so your operator's
  # ruleSelector/serviceMonitorSelector picks it up.
  labels: {}
    # prometheus: victoria-metrics
    # role: monitoring

  # Scrapes every core KubeVirt component (virt-api/virt-controller/virt-handler/
  # virt-operator/virt-exportproxy) through the single Service KubeVirt already
  # exposes for this purpose (kubevirt-prometheus-metrics), selected by the
  # `prometheus.kubevirt.io: "true"` pod label - see
  # https://kubevirt.io/user-guide/operations/component_monitoring/.
  scrape:
    enabled: true
    namespace: kubevirt-hyperconverged
    matchLabels:
      prometheus.kubevirt.io: "true"
    portName: metrics
    scheme: https
    insecureSkipVerify: true

  rules:
    # Synthesizes kubevirt_hyperconverged_operator_health_status (the metric the
    # console dashboard's Virtualization card reads) from the four per-component
    # *_ready_status gauges KubeVirt itself exposes. This is an approximation of
    # HCO's real health metric: it only ever reports 0 (healthy, all components
    # ready) or 2 (critical, any component not ready) - the 1 (warning) tier
    # HCO derives from firing alerts has no equivalent signal here. Disable this
    # if the real hyperconverged-cluster-operator is installed and already
    # provides the genuine metric.
    healthStatus: true
