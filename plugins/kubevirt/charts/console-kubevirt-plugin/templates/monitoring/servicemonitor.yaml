{{- include "console-kubevirt-plugin.monitoring.assertDetected" . }}
{{- if and .Values.monitoring.enabled .Values.monitoring.scrape.enabled (eq (include "console-kubevirt-plugin.monitoring.usePrometheus" .) "true") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "console-kubevirt-plugin.fullname" . }}-kubevirt
  namespace: {{ default .Release.Namespace .Values.monitoring.namespaceOverride }}
  labels:
    {{- include "console-kubevirt-plugin.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.monitoring.scrape.namespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.monitoring.scrape.matchLabels | nindent 6 }}
  endpoints:
    {{- include "console-kubevirt-plugin.monitoring.kubevirtEndpoints" . | nindent 4 }}
{{- end }}
