{{- include "console-kubevirt-plugin.monitoring.assertDetected" . }}
{{- if and .Values.monitoring.enabled (eq (include "console-kubevirt-plugin.monitoring.usePrometheus" .) "true") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "console-kubevirt-plugin.fullname" . }}-monitoring
  namespace: {{ default .Release.Namespace .Values.monitoring.namespaceOverride }}
  labels:
    {{- include "console-kubevirt-plugin.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- include "console-kubevirt-plugin.monitoring.groups" . | nindent 4 }}
{{- end }}
