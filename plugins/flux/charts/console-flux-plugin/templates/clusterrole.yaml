{{- if .Values.useServiceAccountToken -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "console-flux-plugin.fullname" . }}
  labels:
    {{- include "console-flux-plugin.labels" . | nindent 4 }}
rules:
  # Only rendered under useServiceAccountToken, where the backend's
  # hand-rolled REST client (api/k8sclient.go) authenticates as this
  # ServiceAccount instead of as the caller. Its only in-cluster API calls are
  # the POST /v1/reconcile endpoint's (api/reconcile.go): it GETs the target
  # object (to resolve its source, for --with-source-style requests) and
  # PATCHes the `reconcile.fluxcd.io/requestedAt` (and, for HelmRelease,
  # `.../forceAt` / `.../resetAt`) annotations that trigger a Flux controller
  # to reconcile it immediately - exactly what `flux reconcile ...` itself
  # does. Everything else in this plugin (list pages, nav) reads through
  # Console's own K8s API proxy as the logged-in user regardless, so this is
  # the only RBAC the plugin's ServiceAccount ever needs.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["buckets", "gitrepositories", "helmrepositories", "ocirepositories", "helmcharts"]
    verbs: ["get", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
  - apiGroups: ["image.toolkit.fluxcd.io"]
    resources: ["imagepolicies", "imagerepositories", "imageupdateautomations"]
    verbs: ["get", "patch"]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["receivers"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "console-flux-plugin.fullname" . }}
  labels:
    {{- include "console-flux-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "console-flux-plugin.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "console-flux-plugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
