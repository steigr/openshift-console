{{- if not .Values.agent.allowAnonymous }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}-agent-token
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades rather than regenerated: see the agentToken helper.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ include "console-filesystem-plugin.agentToken" . | quote }}
{{- end }}
