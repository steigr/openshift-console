apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "console-filesystem-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "console-filesystem-plugin.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console-filesystem-plugin.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ include "console-filesystem-plugin.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # How the backend finds the agent on the node a pod runs on.
            - name: AGENT_SELECTOR
              value: "app.kubernetes.io/name=filesystem-agent,app.kubernetes.io/instance={{ .Release.Name }}"
            - name: AGENT_PORT
              value: {{ .Values.agent.port | quote }}
            {{- if not .Values.agent.allowAnonymous }}
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "console-filesystem-plugin.workload" . }}-agent-token
                  key: token
            {{- end }}
            # false (the default) makes the backend authorize the caller with a
            # SelfSubjectAccessReview on pods/exec, built from the credentials
            # console forwards; true serves on this plugin's own ServiceAccount
            # without that check.
            - name: USE_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.useServiceAccountToken | quote }}
            # Read back by the frontend from this backend's /config.json.
            - name: POD_FILE_BROWSER_ENABLED
              value: {{ .Values.tabs.podFiles | quote }}
            - name: UPLOAD_CHUNK_BYTES
              value: {{ .Values.frontend.uploadChunkBytes | int64 | quote }}
            - name: VIEW_MAX_BYTES
              value: {{ .Values.frontend.viewMaxBytes | int64 | quote }}
            - name: DEFAULT_ARCHIVE_FORMAT
              value: {{ .Values.frontend.defaultArchiveFormat | quote }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
