# The backend's only ServiceAccount permission.
#
# Everything the plugin does on a user's behalf is done with the credentials
# console forwards -- reading the pod, and the SelfSubjectAccessReview that
# decides whether the user may exec into it. The one thing a user cannot be
# expected to be allowed to do is find the agent pod for a node, which is an
# implementation detail of this plugin rather than something they asked about,
# so that single lookup runs as this ServiceAccount and is scoped to this
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console-filesystem-plugin.workload" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "console-filesystem-plugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.useServiceAccountToken }}
---
# useServiceAccountToken=true makes the backend read pods as itself instead of
# as the caller, so it needs cluster-wide read access to them -- and, with the
# caller's own check skipped, that is the whole of what stands between a
# console user and every container on the cluster. See the value's comment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "console-filesystem-plugin.workload" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "console-filesystem-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "console-filesystem-plugin.workload" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "console-filesystem-plugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
