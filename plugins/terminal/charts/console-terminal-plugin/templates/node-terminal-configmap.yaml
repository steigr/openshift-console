{{- if .Values.nodeTerminal.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nodeTerminal.configMapName }}
  namespace: {{ .Values.nodeTerminal.namespace }}
  labels:
    {{- include "console-terminal-plugin.labels" . | nindent 4 }}
data:
  # Read by this repo's console patch (0006-node-terminal-podspec-via-configmap.patch)
  # and merged into the debug pod's spec.nodeName + container[0].env before
  # the pod is created. See plugins/terminal/node-terminal/IMPLEMENTATION-PLAN.md.
  # Also used directly by this plugin's own Node terminal tab
  # (TERMINAL_PLUGIN_NODE_TERMINAL_ENABLED=true) when it builds the debug pod itself.
  spec: |
    hostPID: {{ .Values.nodeTerminal.hostPID }}
    containers:
      - name: {{ .Values.nodeTerminal.containerName }}
        image: "{{ .Values.nodeTerminal.image.repository }}{{ if .Values.nodeTerminal.image.digest }}@{{ .Values.nodeTerminal.image.digest }}{{ else }}:{{ .Values.nodeTerminal.image.tag | default .Chart.AppVersion }}{{ end }}"
        imagePullPolicy: {{ .Values.nodeTerminal.image.pullPolicy }}
        {{- if .Values.nodeTerminal.homeVolume.enabled }}
        # Without an explicit command, the shim's own PID 1 just idles
        # forever waiting for a *separate* `kubectl exec` invocation with
        # these same args (see node-terminal/src/main.c's run_idle_phase) -
        # console core and this plugin both only ever attach to the
        # container's existing PID 1, so the real pipeline has to be what
        # PID 1 itself runs. --csi-path must match homeVolume.mountPath
        # below, which is why this is only set when homeVolume is enabled -
        # without a real CSI-mounted home directory the pipeline aborts
        # immediately anyway (mountns_resolve_source, pipeline.c).
        command:
          - /node-terminal-shim
          - --csi-path={{ .Values.nodeTerminal.homeVolume.mountPath }}
        {{- end }}
        {{- if .Values.nodeTerminal.sudoReferenceUser }}
        env:
          # Read by identity_inherit_groups() (node-terminal/src/identity.c):
          # the ephemeral session's Linux account is added to this real host
          # user's own supplementary groups (sudo/wheel/admin-ish ones),
          # inheriting the same sudo policy. A cluster-admin-only setting,
          # deliberately not something the frontend/end user can influence -
          # see identity_inherit_groups's own doc comment for why, and for
          # the (safe, non-fatal) behavior when this user doesn't exist on a
          # given node.
          - name: NODE_TERMINAL_SUDO_REFERENCE_USER
            value: {{ .Values.nodeTerminal.sudoReferenceUser | quote }}
        {{- end }}
        stdin: true
        tty: true
        securityContext:
          {{- toYaml .Values.nodeTerminal.securityContext | nindent 10 }}
        {{- if .Values.nodeTerminal.homeVolume.enabled }}
        volumeMounts:
          - name: home
            mountPath: {{ .Values.nodeTerminal.homeVolume.mountPath }}
        {{- end }}
        {{- with .Values.nodeTerminal.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- if .Values.nodeTerminal.homeVolume.enabled }}
    volumes:
      - name: home
        {{- if eq .Values.nodeTerminal.homeVolume.type "csi" }}
        csi:
          driver: {{ .Values.nodeTerminal.homeVolume.csi.driver | quote }}
          {{- if hasKey .Values.nodeTerminal.homeVolume.csi "readOnly" }}
          readOnly: {{ .Values.nodeTerminal.homeVolume.csi.readOnly }}
          {{- end }}
          {{- with .Values.nodeTerminal.homeVolume.csi.volumeAttributes }}
          volumeAttributes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else }}
        # Deliberately the default (disk-backed) medium, never "Memory" -
        # see the values.yaml comment on homeVolume for why tmpfs breaks the
        # shim's bind-mount logic.
        emptyDir: {}
        {{- end }}
    {{- end }}
{{- end }}
