# Default values for console-terminal-plugin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: steigr/console-terminal-plugin
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Pin by digest instead (full "sha256:..." string). When set, this takes
  # precedence over tag/appVersion and the image is referenced as
  # "repository@sha256:...".
  digest: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# The backend only serves the plugin's static assets - it never talks to the
# Kubernetes API (the browser reaches pods/portforward through console's own
# proxy, as the logged-in user), so it needs neither RBAC nor a mounted token.
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  name: http
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# Extra environment variables for the plugin backend container. The backend
# listens on the PORT env var, defaulting to 8080 in the Go binary itself, so
# this is only needed to override that default (keep it in sync with
# service.port and the container port below if you do).
#
# POD_TERMINAL_ENABLED / NODE_TERMINAL_ENABLED (both default "true" in the
# backend when unset) drive the plugin's /config.json, which the frontend
# reads to decide whether TERMINAL_PLUGIN_POD_TERMINAL_ENABLED /
# TERMINAL_PLUGIN_NODE_TERMINAL_ENABLED are set - i.e. whether the Pod/Node
# Terminal tabs are served by this plugin or left to console core's
# built-in ones. Set either to "false" to hand that tab back to core.
env:
  - name: POD_TERMINAL_ENABLED
    value: "true"
  - name: NODE_TERMINAL_ENABLED
    value: "true"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# No explicit healthz route exists in plugins/terminal/main.go or api/*.go,
# so "/" (which serves the plugin's static dist/ assets) is used as a
# best-effort TCP-ish check.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

# ConsolePlugin custom resource (console.openshift.io/v1) that registers this
# backend with the OpenShift console.
consolePlugin:
  create: true
  displayName: "Terminal console plugin"

# The privileged node-terminal break-glass shim (plugins/terminal/node-terminal),
# folded into this chart. This ships the `node-terminal` ConfigMap that both
# console core's patch (0006-node-terminal-podspec-via-configmap.patch) and
# this plugin's own Node terminal tab (when TERMINAL_PLUGIN_NODE_TERMINAL_ENABLED
# is set) read to build the debug pod spec for the shim. Disabling this only
# stops shipping that ConfigMap/RoleBinding - it does not affect image.* above.
nodeTerminal:
  enabled: true

  # The console (core patch, or this plugin's Node tab) reads this ConfigMap
  # by a fixed name (`node-terminal`, or a per-node name given by the
  # `node-terminal.netztronaut.de/spec-reference` node annotation) in a fixed
  # namespace - both overridable below, but default to `node-terminal` in
  # `openshift-console` unless you also changed the patch/plugin or set the
  # per-node annotation.
  configMapName: node-terminal
  namespace: openshift-console

  image:
    repository: steigr/node-terminal-shim
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion. Ignored
    # when digest is set below.
    tag: ""
    # Pin by digest instead of tag - takes precedence over tag when set.
    # Recommended over `tag: latest`: kubelet's IfNotPresent pull policy
    # only skips a re-pull when the image *name:tag* is already cached
    # locally, not when a mutable tag's remote content has changed, so a
    # node that already ran an older debug pod would otherwise keep using
    # its stale cached image indefinitely.
    digest: ""

  # Where the shim binary is mounted/executed from inside the debug pod.
  containerName: node-terminal

  # Required for the shim to setns() into the host's mount/uts/ipc/net/pid
  # namespaces and reach real host PID 1.
  hostPID: true

  # The shim needs CAP_SYS_ADMIN-class privileges (setns across namespaces,
  # mount/umount, raw /etc/passwd+shadow writes).
  securityContext:
    privileged: true

  # The volume the shim's --csi-path (see command above) resolves the
  # session's home directory from. Disabled by default - the shim's own
  # pipeline aborts immediately without a real mount here (pipeline.c's
  # mountns_resolve_source). Two backings are supported:
  #
  # - "emptyDir" (default type below): needs no external CSI driver at all.
  #   kubelet materializes a plain emptyDir as a real directory *on the
  #   node's own root filesystem* and bind-mounts it in, which is exactly
  #   what the shim's own bind-mount logic assumes (node-terminal/src/
  #   mountns.c's mountns_resolve_source reads /proc/self/mountinfo from
  #   inside the container to resolve this mount's host-side source path
  #   before entering the host's mount namespace). The session's home
  #   directory is then just ephemeral scratch space, torn down with the
  #   debug pod - not identity-mapped to the requesting operator.
  #   Deliberately always the *default* medium, never "Memory": a tmpfs
  #   instance isn't reachable by path from a different mount namespace, so
  #   medium: Memory would resolve to "/" and the shim would bind-mount the
  #   *entire host root filesystem* onto the session's home directory
  #   instead of an isolated one - this chart does not expose a medium
  #   option at all, to keep that foot-gun out of reach.
  # - "csi": a real CSI driver providing an *identity-mapped* home directory
  #   (i.e. the requesting operator's own persistent home, not ephemeral
  #   scratch space) - which CSI driver provides that is a cluster-specific,
  #   operator decision outside this repo, so fill in the driver name below
  #   once you have one and switch type to "csi".
  homeVolume:
    enabled: false
    mountPath: /mnt/userhome
    type: emptyDir
    csi:
      driver: ""
      volumeAttributes: {}
      # readOnly: false

  # Optional: a real host username whose supplementary groups (sudo/wheel/
  # admin-ish ones) every ephemeral Node Terminal session's own Linux
  # account gets added to, inheriting the same sudo policy. This is a
  # cluster-admin-only setting - deliberately not something an end user or
  # the frontend can influence (letting a user choose whose privileges to
  # inherit would be a privilege-escalation hole). Empty by default: no
  # extra groups, matching previous behavior. If the named user doesn't
  # exist on a given node, sessions there just get no extra groups (logged,
  # not fatal) - see node-terminal/src/identity.c's identity_inherit_groups
  # doc comment.
  sudoReferenceUser: ""

  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Granting the `privileged` SCC to whoever is allowed to create these debug
  # pods (typically cluster-admins, or a dedicated group) is a cluster policy
  # decision and out of scope for this chart by default. Set `create: true`
  # and list subjects to have this chart manage that RoleBinding for you.
  sccRoleBinding:
    create: false
    subjects: []
    # - kind: Group
    #   name: node-terminal-operators
    #   apiGroup: rbac.authorization.k8s.io
