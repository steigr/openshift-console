{{- include "console-monitoring-plugin.monitoring.assertDetected" . }}
{{- if and .Values.monitoring.enabled (eq (include "console-monitoring-plugin.monitoring.useVictoriaMetrics" .) "true") }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "console-monitoring-plugin.fullname" . }}-dashboard-recording-rules
  namespace: {{ default .Release.Namespace .Values.monitoring.namespaceOverride }}
  labels:
    {{- include "console-monitoring-plugin.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- include "console-monitoring-plugin.monitoring.groups" . | nindent 4 }}
{{- end }}
