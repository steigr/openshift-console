# Default values for console-monitoring-plugin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: steigr/console-monitoring-plugin
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Pin by digest instead (full "sha256:..." string). When set, this takes
  # precedence over tag/appVersion and the image is referenced as
  # "repository@sha256:...".
  digest: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  name: http
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# NOTE: the plugin backend (plugins/monitoring/main.go) registers no dedicated
# healthz route -- it only serves the embedded static frontend plus /config.json.
# "/" is used here as the probe path for lack of a real health endpoint.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}

# Config served by the plugin backend at /config.json (proxied by console at
# /api/plugins/monitoring-plugin/config.json), read by the frontend to tell a
# non-CMO Prometheus-compatible backend (e.g. VictoriaMetrics) apart from the
# OpenShift default CMO/Prometheus stack, instead of relying on hardcoded CMO
# labels/RBAC. See plugins/monitoring/api/config.go and
# plugins/monitoring/VICTORIA-METRICS-TODO.md.
platformPrometheus:
  # Value of the `prometheus` label carried by Platform-sourced alerts/targets
  # series. Rendered as PLATFORM_PROMETHEUS_LABEL.
  label: openshift-monitoring/k8s
  # Group/resource/name used by the frontend's SelfSubjectAccessReview checks
  # that decide whether the current user has cluster-wide (non-tenancy) access
  # to alerts/metrics. Rendered as PLATFORM_ACCESS_REVIEW_GROUP,
  # PLATFORM_ALERTS_ACCESS_REVIEW_RESOURCE, PLATFORM_METRICS_ACCESS_REVIEW_RESOURCE
  # and PLATFORM_METRICS_ACCESS_REVIEW_NAME.
  accessReview:
    group: monitoring.coreos.com
    alertsResource: prometheusrules
    metricsResource: prometheuses/api
    metricsName: k8s

# This registers the plugin with console via a ConsolePlugin custom resource
# (see charts/openshift-console-crds for the CRD). Requires cluster-admin
# privileges to install the CR and console-operator's Console CR to list this
# plugin under spec.plugins before it will actually be loaded.
consolePlugin:
  create: true
  displayName: "Monitoring console plugin"

# Recording rules the console dashboard's Overview widgets need but that
# upstream cluster-monitoring-operator (CMO) would normally provide, for
# clusters that don't run CMO itself (e.g. VictoriaMetrics-backed monitoring
# stacks). Without these, the dashboard's Network transfer and Pod count
# widgets stay empty ("Not available").
monitoring:
  enabled: true

  # Which CRD flavor to render. When autoDetect is true (the default), prometheus/
  # victoriaMetrics below are ignored: renders VMRule if the VMRule CRD
  # (operator.victoriametrics.com/v1beta1) is present, else PrometheusRule if
  # that CRD (monitoring.coreos.com/v1) is present, else the release fails.
  # VictoriaMetrics is preferred when both CRDs are present.
  #
  # Set autoDetect to false to control rendering explicitly instead - either or
  # both of prometheus/victoriaMetrics may be enabled to render both resources.
  autoDetect: true
  prometheus: false
  victoriaMetrics: false

  # Namespace-less by default: the rule resource is created in the release
  # namespace. Override if your operator only selects rules from a specific
  # namespace.
  namespaceOverride: ""

  # Extra labels merged onto the rule resource so your operator's ruleSelector
  # picks it up.
  labels: {}
    # prometheus: victoria-metrics
    # role: monitoring

  # Individual rule groups can be disabled if you only need one.
  rules:
    nodeExporter: true
    clusterMonitoringOperator: true

  # Extra labels to strip from kube_running_pod_ready's output, on top of the
  # upstream cluster-monitoring-operator exclusion list (condition, container,
  # endpoint, instance, job, service). Needed when your Prometheus/VictoriaMetrics
  # instance injects a global external label (e.g. federation's "prometheus"
  # label) onto scraped/ingested series: node_namespace_pod:kube_pod_info: (the
  # metric the console dashboard joins kube_running_pod_ready against) is
  # normally built with an inclusion-style `by(...)` aggregation that already
  # drops such labels, so kube_running_pod_ready must drop them too or the
  # dashboard's `ignoring(node,uid)` join silently matches nothing.
  dropExternalLabels:
    - prometheus

# Grants the OpenShift console's own ServiceAccount (a separate Helm release,
# deployed by this repo's charts/openshift-console chart) permission to list
# the ConfigMaps backing console's built-in "Observe > Dashboards" custom
# dashboard feature (console.openshift.io/dashboard=true labeled ConfigMaps
# in openshift-config-managed, read via pkg/server/resource_lister.go using
# console's own credentials, not the logged-in user's token). Without this,
# /api/console/monitoring-dashboard-config returns 403 "console service
# account cannot list resource" and the Dashboards page shows "Error Loading
# Dashboards". On a full OpenShift cluster this RBAC is shipped by
# cluster-console-operator, which this repo's console deployment doesn't run.
dashboardConfigRBAC:
  enabled: false
  # Name/namespace of the console Deployment's ServiceAccount to bind.
  # Defaults match charts/openshift-console's defaults when its release is
  # named "console".
  consoleServiceAccountName: console
  consoleServiceAccountNamespace: openshift-console
  # Namespace console's backend lists dashboard ConfigMaps from. Hardcoded on
  # the console side (cmd/bridge/main.go) - not actually configurable there,
  # only exposed here for documentation / in case it ever changes.
  configMapNamespace: openshift-config-managed
