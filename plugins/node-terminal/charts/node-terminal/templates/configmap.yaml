apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
  namespace: {{ .Values.namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # Read by this repo's console patch (0006-node-terminal-podspec-via-configmap.patch)
  # and merged into the debug pod's spec.nodeName + container[0].env before
  # the pod is created. See plugins/node-terminal/IMPLEMENTATION-PLAN.md.
  spec: |
    hostPID: {{ .Values.hostPID }}
    containers:
      - name: {{ .Values.containerName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        stdin: true
        tty: true
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- if .Values.homeVolume.enabled }}
        volumeMounts:
          - name: home
            mountPath: {{ .Values.homeVolume.mountPath }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- if .Values.homeVolume.enabled }}
    volumes:
      - name: home
        csi:
          driver: {{ .Values.homeVolume.csi.driver | quote }}
          {{- if hasKey .Values.homeVolume.csi "readOnly" }}
          readOnly: {{ .Values.homeVolume.csi.readOnly }}
          {{- end }}
          {{- with .Values.homeVolume.csi.volumeAttributes }}
          volumeAttributes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- end }}
