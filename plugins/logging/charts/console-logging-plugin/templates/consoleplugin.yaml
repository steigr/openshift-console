{{- if .Values.consolePlugin.create -}}
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  # This must match the plugin name the frontend is built with (package.json's
  # consolePlugin.name) and the one src/fetch-patch.ts rewrites core's kubelet
  # journal URLs to, since that URL contains this name.
  name: logging-console-plugin
  labels:
    {{- include "console-logging-plugin.labels" . | nindent 4 }}
spec:
  displayName: {{ .Values.consolePlugin.displayName | quote }}
  backend:
    type: Service
    service:
      name: {{ include "console-logging-plugin.fullname" . | trimPrefix "console-" }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.service.port }}
      basePath: /
  # The journal API is served here, not on the asset route: console proxies
  # /api/proxy/plugin/logging-console-plugin/api/<rest> to the Service
  # below and strips that prefix, passing the method, query string and body
  # through -- and, with UserToken, the logged-in user's own credentials, which
  # the backend reviews before serving any node logs.
  proxy:
    - alias: api
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: {{ include "console-logging-plugin.fullname" . | trimPrefix "console-" }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.port }}
  i18n:
    loadType: Preload
{{- end }}
