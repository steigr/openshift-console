apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console-node-logging-plugin.fullname" . | trimPrefix "console-" }}
  labels:
    {{- include "console-node-logging-plugin.labels" . | nindent 4 }}
rules:
  # The plugin backend looks up the node-logs-api pod running on a given
  # node to proxy journal requests to it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console-node-logging-plugin.fullname" . | trimPrefix "console-" }}
  labels:
    {{- include "console-node-logging-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console-node-logging-plugin.fullname" . | trimPrefix "console-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "console-node-logging-plugin.serviceAccountName" . | trimPrefix "console-" }}
    namespace: {{ .Release.Namespace }}
