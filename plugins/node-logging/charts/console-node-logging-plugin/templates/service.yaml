apiVersion: v1
kind: Service
metadata:
  name: {{ include "console-node-logging-plugin.fullname" . | trimPrefix "console-" }}
  labels:
    {{- include "console-node-logging-plugin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.name }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "console-node-logging-plugin.selectorLabels" . | nindent 4 }}
