# Default values for openshift-synchronizer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: steigr/openshift-synchronizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Requires the project.openshift.io/v1 Project CRD from
# charts/openshift-console-crds (crds.Project=true) to already be installed
# in the cluster.
rbac:
  create: true

# Base URL of a Prometheus-compatible query API (e.g.
# http://prometheus.openshift-monitoring.svc:9090), passed to the
# controller as --prometheus-url. Used to derive a Node's
# beta.kubernetes.io/instance-type label from node_dmi_info when the Node
# has no openshift.io/instance-type label of its own. Leave empty to
# disable the fallback.
prometheus:
  url: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}
affinity: {}
tolerations: []
