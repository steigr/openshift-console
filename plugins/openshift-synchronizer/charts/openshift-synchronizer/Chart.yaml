apiVersion: v2
name: openshift-synchronizer
description: >-
  Controller that mirrors every Namespace onto a same-named
  project.openshift.io/v1 Project (create on add, keep status.phase in
  sync, delete on removal). Fills the gap left by charts/openshift-console-crds'
  Project CRD on clusters without OpenShift's aggregated project-registry
  API, so the console's Project-backed views work on vanilla Kubernetes too.
type: application
version: 0.3.0
appVersion: "0.3.0"
